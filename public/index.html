<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant CRM - Customer Tracking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Plant CRM</h1>
            <p>Customer Relations Management for Plant Business</p>
        </header>

        <div class="main-content">
            <!-- Filters Section -->
            <section class="filters">
                <h2>Filters</h2>
                <div class="filter-group">
                    <input type="text" id="searchInput" placeholder="Search customers...">
                </div>
                <div class="filter-group">
                    <label>Platform:</label>
                    <select id="platformFilter">
                        <option value="">All Platforms</option>
                        <option value="PalmStreet">PalmStreet</option>
                        <option value="Etsy">Etsy</option>
                        <option value="Both">Both</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>
                        <input type="checkbox" id="sellerFilter">
                        Sellers Only
                    </label>
                </div>
                <div class="filter-group">
                    <label>Min Orders:</label>
                    <input type="number" id="minOrdersFilter" min="0" placeholder="0">
                </div>
                <div class="filter-group">
                    <label>Tag:</label>
                    <select id="tagFilter">
                        <option value="">All Tags</option>
                    </select>
                </div>
                <button id="applyFilters" class="btn btn-primary">Apply Filters</button>
                <button id="clearFilters" class="btn btn-secondary">Clear</button>
            </section>

            <!-- Actions Section -->
            <section class="actions">
                <button id="addCustomerBtn" class="btn btn-success">Add Customer</button>
                <button id="addOrderBtn" class="btn btn-success">Add Order</button>
            </section>

            <!-- Customers List -->
            <section class="customers-section">
                <h2>Customers</h2>
                <div id="customersList" class="customers-list">
                    <!-- Customers will be loaded here -->
                </div>
            </section>
        </div>
    </div>

    <!-- Modal for Add/Edit Customer -->
    <div id="customerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="customerModalTitle">Add Customer</h2>
            <form id="customerForm">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="customerName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="customerEmail">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="customerPhone">
                </div>
                <div class="form-group">
                    <label>Platform *</label>
                    <select id="customerPlatform" required>
                        <option value="PalmStreet">PalmStreet</option>
                        <option value="Etsy">Etsy</option>
                        <option value="Both">Both</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="customerIsSeller">
                        Is this customer also a seller?
                    </label>
                </div>
                <button type="submit" class="btn btn-primary">Save Customer</button>
            </form>
        </div>
    </div>

    <!-- Modal for Add Order -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Order</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label>Customer *</label>
                    <select id="orderCustomer" required>
                        <option value="">Select a customer...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Order Number</label>
                    <input type="text" id="orderNumber">
                </div>
                <div class="form-group">
                    <label>Platform *</label>
                    <select id="orderPlatform" required>
                        <option value="PalmStreet">PalmStreet</option>
                        <option value="Etsy">Etsy</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Order Date *</label>
                    <input type="date" id="orderDate" required>
                </div>
                <div class="form-group">
                    <label>Items *</label>
                    <textarea id="orderItems" rows="3" required placeholder="List the plants purchased..."></textarea>
                </div>
                <div class="form-group">
                    <label>Total Amount *</label>
                    <input type="number" id="orderAmount" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="orderNotes" rows="2" placeholder="Any additional notes..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Order</button>
            </form>
        </div>
    </div>

    <!-- Modal for Customer Details -->
    <div id="detailsModal" class="modal">
        <div class="modal-content large">
            <span class="close">&times;</span>
            <div id="customerDetails">
                <!-- Customer details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
